<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chathura De Silva</title>
    <link rel="icon" type="image/png" href="./assets/favicon.png" />

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.tailwindcss.com"></script>
    
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        matte: {
                            light: '#f5f5f7', // Off-white matte
                            dark: '#121212',  // Deep charcoal matte
                            glassLight: 'rgba(255, 255, 255, 0.65)',
                            glassDark: 'rgba(30, 30, 30, 0.65)',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-matte-light dark:bg-matte-dark text-slate-800 dark:text-slate-200 transition-colors duration-300">
    <div id="root"></div>

    <script type="text/babel" src="script.js"></script>
</body>
</html>
